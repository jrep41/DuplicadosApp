[package]
name = "duplicados-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Buscador de archivos duplicados con borrado seguro (port a Rust del original C#/WPF)"
publish = false

[[bin]]
name = "DuplicadosApp"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
eframe = "0.37"
rfd = "0.18"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
